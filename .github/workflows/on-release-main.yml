name: release-main

on:
  release:
    types: [published]

jobs:

  release-note:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - run: npx changelogithub
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment:
      name: pypi
      url: https://pypi.org/project/bub
    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env

      # bub and bubling are released together: build both at the tag's version and pin bub to that bubling.
      - name: Pin bubling to the release version
        run: python scripts/release.py pin "${GITHUB_REF_NAME#v}"

      - name: Build packages
        # Pinning dirties the checkout, which would make hatch-vcs compute a dev version.
        run: SETUPTOOLS_SCM_PRETEND_VERSION="${GITHUB_REF_NAME#v}" uv build --all-packages

      - name: Check release metadata
        run: python scripts/release.py check "${GITHUB_REF_NAME#v}" dist

      - name: Publish package
        run: uv publish --trusted-publishing always
