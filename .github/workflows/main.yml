name: Main

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - uses: j178/prek-action@v1

  tests-and-type-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
      fail-fast: false
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        run: uv run python -m pytest tests

      - name: Check typing
        run: uv run mypy




  core-only-install:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env

      - name: Build the wheel
        run: uv build --wheel -o dist

      # `pip install bub` without the app extra installs only the agent kernel.
      - name: Use bub.agent without the app extra
        run: |
          uv run --isolated --no-project --with dist/bub-*.whl python - <<'EOF'
          import importlib.util
          from bub.agent import Agent
          from bub.store import InMemoryTapeStore
          import bub.errors, bub.store, bub.tape, bub.tools

          Agent(store=InMemoryTapeStore())
          app_modules = ("typer", "pluggy", "pydantic_settings", "yaml", "rapidfuzz", "telegram", "rich")
          assert not [m for m in app_modules if importlib.util.find_spec(m)], "app dependencies were installed"
          EOF

      - name: The bub command asks for the app extra
        run: |
          if output=$(uv run --isolated --no-project --with dist/bub-*.whl bub 2>&1); then
            echo "bub ran without the app extra"; exit 1
          fi
          echo "$output"
          grep -q "bub\[app\]" <<<"$output"

  check-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: website/package.json

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: website/.node-version
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Check if documentation can be built
        run: |
          pnpm --dir website install --frozen-lockfile
          pnpm --dir website build
