strictPeerDependencies: true
engineStrict: true

# Release cooldown, in minutes. Three days, to block supply-chain attacks. A
# frozen install also fails while any lockfile entry is younger.
minimumReleaseAge: 4320

# Allow the pinned Pele release used for this migration.
minimumReleaseAgeExclude:
  - pele@1.6.0

# Patch pinned transitive dependencies until upstream adopts these fixes.
overrides:
  # https://github.com/advisories/GHSA-px8p-9vwx-vf98
  satori>fflate: ^0.7.5
  # https://github.com/advisories/GHSA-3wwx-pv8p-q78v
  miniflare>undici: ^7.29.1

# Packages that are not listed here keep their install scripts disabled.
allowBuilds:
  esbuild: true
  sharp: true
  workerd: true

# Starlight's HTML processors use Sätteri in the Cloudflare bundle. Install
# its WASI fallback as well as the native binding used to prerender in Node.
supportedArchitectures:
  cpu:
    - current
    - wasm32
