repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: "v5.0.0"
    hooks:
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: check-json
        exclude: ^.devcontainer/devcontainer.json
      - id: pretty-format-json
        exclude: ^.devcontainer/devcontainer.json
        args: [--autofix, --no-sort-keys, --no-ensure-ascii]
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/jendrikseipp/vulture
    rev: "v2.14"
    hooks:
      - id: vulture
        stages: [manual]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: "v0.11.5"
    hooks:
      - id: ruff
        args: [--exit-non-zero-on-fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: import-linter
        name: import-linter
        # Contracts live in pyproject.toml; grimp finds the packages through PYTHONPATH without installing them.
        entry: env PYTHONPATH=src:packages/bubling/src lint-imports
        language: python
        additional_dependencies: ["import-linter==2.15"]
        pass_filenames: false
        files: ^((src|packages/[^/]+/src)/.*\.py|pyproject\.toml)$
