[project]
name = "bub-e2e"
version = "0.1.0"
description = "External end-to-end harness for Bub"
requires-python = ">=3.12,<4.0"
dependencies = [
    "harbor>=0.16,<0.17",
    "pydantic-settings>=2.7,<3",
    "pyyaml>=6,<7",
]

[project.scripts]
bub-e2e = "bub_e2e.__main__:main"

[dependency-groups]
dev = [
    "mypy>=1.19,<2",
    "pytest>=9,<10",
    "ruff>=0.14,<0.15",
    "types-pyyaml>=6,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bub_e2e"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["A", "B", "C4", "C90", "E", "F", "I", "PGH", "RUF", "S", "SIM", "T10", "TRY", "UP", "W", "YTT"]
ignore = ["E501", "S603", "TRY003"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.ruff.format]
preview = true
